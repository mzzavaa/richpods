engineStrict: true

packages:
  - editor
  - player
  - server
  - shared
  - website
  - cloud-functions/validate-mp3
  - cloud-functions/check-verifications
  - cloud-functions/check-media
  - cloud-functions/generative-ai-tools

catalog:
  "@graphql-codegen/cli": "6.3.1"
  "@graphql-codegen/typescript": "5.0.10"
  "@graphql-codegen/typescript-graphql-request": "7.1.0"
  "@graphql-codegen/typescript-operations": "5.1.0"
  "@graphql-codegen/typescript-resolvers": "5.1.8"
  "@richpods/coloeus": "0.3.3"
  "@richpods/echarts-sandbox": "0.0.1"
  "@richpods/tiny-geojson-tool": "0.4.1"
  "@tsconfig/node24": "24.0.5"
  "@types/node": "25.9.9"
  "@vue/eslint-config-prettier": "10.2.0"
  "@vue/eslint-config-typescript": "14.9.0"
  "@vue/tsconfig": "0.9.1"
  "dompurify": "3.4.17"
  "firebase": "12.19.0"
  "graphql": "16.14.2"
  "maplibre-gl": "5.24.0"
  "modern-normalize": "3.0.1"
  "pmtiles": "4.5.0"
  "typescript": "6.0.3"
  "vitest": "4.1.12"
  "vue": "3.5.44"
  "vue-i18n": "11.4.15"
  "vue-router": "5.4.0"
overrides:
  vite: 8.3.4
  ipaddr.js: 2.5.0
  protobufjs: 7.6.6
  shell-quote: 1.12.0
  websocket-driver: 0.7.5
  tar: 7.5.22
saveExact: true
linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: true
sharedWorkspaceLockfile: true
allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false
  re2: false
  sharp: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@firebase/ai@2.16.0'
  - '@firebase/analytics-compat@0.2.31'
  - '@firebase/analytics@0.10.25'
  - '@firebase/app-compat@0.5.18'
  - '@firebase/app@0.16.2'
  - '@firebase/auth-compat@0.6.11'
  - '@firebase/auth@1.13.6'
  - '@firebase/firestore-compat@0.4.14'
  - '@firebase/firestore@4.17.2'
  - '@firebase/messaging-compat@0.2.30'
  - '@firebase/messaging@0.13.3'
  - firebase-tools@15.30.0
  - firebase@12.19.0
